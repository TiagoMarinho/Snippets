# fly.toml

app = "snippets"
primary_region = "fra"

[build]
  builder = "paketobuildpacks/builder:base"

[env]
  DATABASE_PATH = "/data/database.sqlite"

[deploy]
  release_command = "npm run register"

[processes]
  app = "npm run start"

[mounts]
  source="snippets_data"
  destination="/data"

[[services]]
  processes = ["app"]
  protocol = "tcp"
  internal_port = 8080

  [services.concurrency]
    hard_limit = 25
    soft_limit = 20

  [[services.ports]]
    port = 10000

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    port = 10000